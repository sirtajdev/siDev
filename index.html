<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siDev</title>
    <link rel="icon" type="image/png" href="Assets/Frame 2.png" />
    <style>
      :root {
        --bg-1: #02090d;
        --bg-2: #0d1f2b;
        --card: rgba(10, 18, 24, 0.9);
        --panel: rgba(8, 14, 20, 0.76);
        --accent-1: #5aa9ff;
        --accent-2: #7ee7ff;
        --accent-3: #dff6ff;
        --text: #f2f8ff;
        --muted: #bfd8eb;
        --line: rgba(166, 212, 255, 0.22);
        --button-1: #3a9ce1;
        --button-2: #5fe9d6;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(58, 136, 255, 0.18), transparent 28%),
          linear-gradient(135deg, #01070b, #0a151d 42%, #122534 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 10px 0 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        letter-spacing: 0.04em;
        font-weight: 700;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(76,180,255,0.8), rgba(90,233,214,0.8));
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: 0 10px 24px rgba(56, 164, 232, 0.35);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      nav {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        transition: 0.2s ease;
      }

      nav a:hover {
        border-color: rgba(130, 212, 255, 0.6);
        background: rgba(103, 180, 255, 0.08);
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: 26px;
        align-items: center;
        padding: 44px 0 14px;
      }

      .title-block {
        background: rgba(5, 11, 16, 0.72);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 30px 30px 28px;
        box-shadow: 0 22px 50px rgba(1, 11, 18, 0.3);
        text-align: center;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        background: rgba(78, 176, 255, 0.12);
        border: 1px solid rgba(118, 203, 255, 0.28);
        color: var(--accent-3);
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.08;
        margin: 18px 0 14px;
      }

      .lead {
        font-size: 1.06rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 62ch;
        margin: 0 auto 12px;
        text-align: center;
      }

      .mini-logo {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.03);
      }

      .downloads-panel {
        margin-top: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(8, 18, 28, 0.54);
        padding: 26px;
      }

      .downloads-panel h2 {
        margin-top: 0;
        font-size: clamp(1.5rem, 3vw, 2.3rem);
      }

      .download-layout {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 22px;
        align-items: center;
      }

      .download-image {
        width: 100%;
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.02);
      }

      .button-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 18px;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        padding: 16px 20px;
        border-radius: 14px;
        color: #041922;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(135deg, var(--button-1), var(--button-2));
        box-shadow: 0 12px 28px rgba(77, 181, 255, 0.28);
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      .download-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      .download-button.secondary {
        background: linear-gradient(135deg, rgba(76,180,255,0.18), rgba(94,233,214,0.18));
        color: var(--text);
        border: 1px solid rgba(123, 213, 255, 0.3);
        box-shadow: none;
      }

      @media (max-width: 780px) {
        .hero,
        .download-layout {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand" aria-label="siDev brand">
          <div class="brand-mark">
            <img src="Assets/Frame 2.png" alt="siDev icon" />
          </div>
          <span>siDev</span>
        </div>

        <nav aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="downloads.html">Downloads</a>
          <a href="credits.html">Credits</a>
        </nav>
      </header>

      <main>
        <section class="hero" id="home">
          <div class="title-block">
            <span class="eyebrow">Open-source initiative</span>
            <h1>siDev</h1>
            <p class="lead">
              siDev is a project run by Sirtaj Suri and Iknoor Singh.
            </p>
            <p class="lead">
              Currently, we aim to enable support for platforms aiding in Gurdwaras that use Linux-based or other operating systems.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
