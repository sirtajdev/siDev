<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<script src="../js/script.js" defer></script>
		<title>Contact - siDev</title>
		<link rel="icon" type="image/png" href="../Assets/Frame 2.png" />
		<style>
			:root {
				--bg-1: #071c2d;
				--bg-2: #123c5d;
				--accent-1: #4cb4ff;
				--accent-2: #7ee7ff;
				--accent-3: #d7f4ff;
				--text: #edf9ff;
				--muted: #b7d9eb;
				--line: rgba(158, 216, 255, 0.26);
				--button-1: #3a9ce1;
				--button-2: #5fe9d6;
			}

			* { box-sizing: border-box; }

			body {
				margin: 0;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background:
					radial-gradient(circle at top left, rgba(80, 164, 255, 0.25), transparent 28%),
					linear-gradient(135deg, var(--bg-1), var(--bg-2));
				color: var(--text);
				min-height: 100vh;
			}

			.container {
				max-width: 1100px;
				margin: 0 auto;
				padding: 24px 24px 80px;
			}

			.topbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 20px;
				padding: 10px 0 26px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				letter-spacing: 0.04em;
				font-weight: 700;
			}

			.brand-mark {
				width: 52px;
				height: 52px;
				border-radius: 16px;
				background: linear-gradient(135deg, rgba(76,180,255,0.8), rgba(90,233,214,0.8));
				border: 1px solid rgba(255,255,255,0.35);
				box-shadow: 0 10px 24px rgba(56, 164, 232, 0.35);
				display: grid;
				place-items: center;
				overflow: hidden;
			}

			.brand-mark img { width: 100%; height: 100%; object-fit: cover; }

			nav { display: flex; gap: 14px; flex-wrap: wrap; }

			nav a {
				color: var(--text);
				text-decoration: none;
				padding: 10px 18px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.02);
			}

			nav a:hover { border-color: rgba(130, 212, 255, 0.6); background: rgba(103, 180, 255, 0.08); }

			body { animation: page-enter 0.7s ease both; }
			.topbar, main { animation: content-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
			main { animation-delay: 0.08s; }
			.contact-panel, button { transition: transform 0.3s ease, box-shadow 0.3s ease; }
			.contact-panel:hover { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(1, 11, 18, 0.4); }
			button:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 14px 30px rgba(77, 181, 255, 0.3); }
			@keyframes page-enter { from { opacity: 0; } to { opacity: 1; } }
			@keyframes content-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
			}

			.nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
			.menu-button { display: none; }
			.menu-button::before {
				content: ""; width: 16px; height: 2px; background: currentColor;
				box-shadow: 0 5px currentColor, 0 10px currentColor;
			}
			.topbar-tools { display: flex; align-items: center; gap: 12px; }
			.menu-button {
				color: var(--text); cursor: pointer; padding: 10px 14px;
				border: 1px solid var(--line); border-radius: 999px;
				background: rgba(255, 255, 255, 0.02); font: inherit;
			}

			.contact-panel {
				background: rgba(12, 26, 39, 0.38);
				border: 1px solid var(--line);
				border-radius: 28px;
				padding: 30px;
				box-shadow: 0 22px 50px rgba(1, 11, 18, 0.25);
			}

			h1 { font-size: clamp(2.3rem, 5vw, 4rem); line-height: 1.08; margin: 0 0 24px; }
			h2 { color: var(--accent-2); margin: 0 0 18px; }
			p { color: var(--muted); line-height: 1.6; }
			.contact-link { color: var(--accent-2); text-decoration: none; }
			.contact-link:hover { color: var(--accent-3); text-decoration: underline; }

			button {
				margin-top: 8px;
				padding: 13px 20px;
				border: 0;
				border-radius: 14px;
				color: #041922;
				font-weight: 700;
				background: linear-gradient(135deg, var(--button-1), var(--button-2));
				cursor: pointer;
			}

			#phone { display: none; margin: 12px 0 0; }
			#phone.visible { display: block; }

			@media (max-width: 780px) {
				.topbar { flex-direction: column; align-items: center; }
				.topbar-tools { align-self: stretch; position: relative; flex-wrap: wrap; justify-content: flex-end; }
				.menu-button { display: block; }
				nav {
					display: flex; visibility: hidden; opacity: 0; pointer-events: none; transform: translateY(-8px) scale(0.98);
					position: absolute; right: 0; top: calc(100% + 8px); z-index: 2;
					min-width: 180px; padding: 10px; flex-direction: column;
					border: 1px solid var(--line); border-radius: 14px; background: #071c2d;
				}
				nav a { border: 0; border-radius: 8px; }
				.nav-toggle:checked ~ nav { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
				.topbar-tools nav { order: 3; width: 100%; }
			}
		</style>
	</head>
	<body>
		<div class="container">
			<header class="topbar">
				<div class="brand" aria-label="siDev brand">
					<div class="brand-mark"><img src="../Assets/Frame 2.png" alt="siDev icon" /></div>
					<span>siDev</span>
				</div>
				<div class="topbar-tools">
					<label class="menu-button" for="nav-toggle" role="button" tabindex="0" aria-controls="main-nav" aria-expanded="false">Menu</label>
					<input class="nav-toggle" type="checkbox" id="nav-toggle" />
					<nav id="main-nav" aria-label="Main navigation">
					<a href="/">Home</a>
					<a href="/downloads/">Downloads</a>
					<a href="/credits/">Credits</a>
					<a href="/contact/">Contact</a>
					</nav>
				</div>
			</header>

			<main>
				<section class="contact-panel" id="main-content" tabindex="-1">
					<h1>Contact</h1>
					<h2>Get in touch</h2>
					<p>Email: <a class="contact-link" href="mailto:sirtaj.dev@gmail.com">sirtaj.dev@gmail.com</a></p>
					<button type="button" id="reveal-phone" aria-controls="phone" aria-expanded="false">Show Phone Number</button>
					<p id="phone">+1 (732) 484-5606</p>
				</section>
			</main>
		</div>

		<script>
			document.getElementById("reveal-phone").addEventListener("click", function () {
				document.getElementById("phone").classList.add("visible");
				this.setAttribute("aria-expanded", "true");
				this.style.display = "none";
			});
		</script>
	</body>
</html>
