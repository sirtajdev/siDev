<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCSRL4926Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SCSRL4926Q');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script src="../js/script.js" defer></script>
    <title>Downloads - siDev</title>
    <link rel="icon" type="image/png" href="../Assets/Frame 2.png" />
    <style>
      :root {
        --bg-1: #071c2d;
        --bg-2: #123c5d;
        --card: rgba(15, 37, 58, 0.9);
        --panel: rgba(12, 24, 39, 0.76);
        --accent-1: #4cb4ff;
        --accent-2: #7ee7ff;
        --accent-3: #d7f4ff;
        --text: #edf9ff;
        --muted: #b7d9eb;
        --line: rgba(158, 216, 255, 0.26);
        --button-1: #3a9ce1;
        --button-2: #5fe9d6;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(80, 164, 255, 0.25), transparent 28%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 10px 0 26px;
        position: relative;
        z-index: 10;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        letter-spacing: 0.04em;
        font-weight: 700;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(76,180,255,0.8), rgba(90,233,214,0.8));
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: 0 10px 24px rgba(56, 164, 232, 0.35);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      nav {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        transition: 0.2s ease;
      }

      nav a:hover {
        border-color: rgba(130, 212, 255, 0.6);
        background: rgba(103, 180, 255, 0.08);
      }

      body { animation: page-enter 0.7s ease both; }
      .topbar, main { animation: content-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      main { animation-delay: 0.08s; }
      .downloads-panel, .download-button { transition: transform 0.3s ease, box-shadow 0.3s ease; }
      .downloads-panel:hover { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(1, 11, 18, 0.4); }
      .download-button:hover { transform: translateY(-3px) scale(1.01); }
      @keyframes page-enter { from { opacity: 0; } to { opacity: 1; } }
      @keyframes content-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }

      .nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
      .menu-button { display: inline-flex; align-items: center; gap: 10px; position: relative; z-index: 21; }
      .menu-button::before {
        content: ""; width: 16px; height: 2px; background: currentColor;
        box-shadow: 0 5px currentColor, 0 10px currentColor;
      }
      .topbar-tools { display: flex; align-items: center; gap: 12px; position: relative; z-index: 20; }
      .menu-button {
        color: var(--text); cursor: pointer; padding: 10px 14px;
        border: 1px solid var(--line); border-radius: 999px;
        background: rgba(255, 255, 255, 0.02); font: inherit;
      }
      .topbar-tools nav {
        display: none; position: absolute; right: 0; top: calc(100% + 10px); z-index: 20;
        min-width: 190px; padding: 10px; flex-direction: column; flex-wrap: nowrap;
        border: 1px solid var(--line); border-radius: 14px; background: #071c2d;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
        opacity: 0; transform: translateY(-8px) scale(0.98); transition: opacity 0.22s ease, transform 0.22s ease;
      }
      .topbar-tools nav a { border: 0; border-radius: 8px; }
      .nav-toggle:checked ~ nav { display: flex; opacity: 1; transform: translateY(0) scale(1); }

      .downloads-panel {
        margin-top: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(8, 18, 28, 0.54);
        padding: 26px;
      }

      .downloads-panel h2 {
        margin-top: 0;
        font-size: clamp(1.5rem, 3vw, 2.3rem);
      }

      .download-layout {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 22px;
        align-items: center;
      }

      .download-image {
        width: 100%;
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.02);
      }

      .download-options {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .download-option {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        padding: 16px 20px;
        border-radius: 14px;
        color: #041922;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(135deg, var(--button-1), var(--button-2));
        box-shadow: 0 12px 28px rgba(77, 181, 255, 0.28);
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      .download-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      .download-description {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 4px;
      }

      @media (max-width: 780px) {
        .download-layout {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: center;
        }

        .topbar-tools { align-self: stretch; position: relative; flex-wrap: wrap; justify-content: flex-end; }
        .menu-button { display: inline-flex; }
        nav {
          display: flex; visibility: hidden; opacity: 0; pointer-events: none; transform: translateY(-8px) scale(0.98);
          position: absolute; right: 0; top: calc(100% + 8px); z-index: 2;
          min-width: 180px; padding: 10px; flex-direction: column;
          border: 1px solid var(--line); border-radius: 14px; background: #071c2d;
        }
        nav a { border: 0; border-radius: 8px; }
        .nav-toggle:checked ~ nav { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
        .topbar-tools nav { order: 3; width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand" aria-label="siDev brand">
          <div class="brand-mark">
            <img src="../Assets/Frame 2.png" alt="siDev icon" />
          </div>
          <span>siDev</span>
        </div>

        <div class="topbar-tools">
          <label class="menu-button" for="nav-toggle" role="button" tabindex="0" aria-controls="main-nav" aria-expanded="false">Menu</label>
          <input class="nav-toggle" type="checkbox" id="nav-toggle" />
          <nav id="main-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/downloads/">Downloads</a>
            <a href="/credits/">Credits</a>
            <a href="/contact/">Contact</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="downloads-panel" id="main-content" tabindex="-1">
          <h2>Downloads</h2>
          <div class="download-layout">
            <img class="download-image" src="../Assets/sttm-linux.png" alt="siDev Linux app icon" />
            <div class="download-options">
              <div class="download-option">
                <a href="https://www.dropbox.com/scl/fi/nuhh5if7ppzwgdkg840n9/sttm-desktop_9.3.2_amd64.deb?rlkey=gkp4om6rwzqdkcjkrdy69q1xt&st=y51c4i61&dl=1" class="download-button">Download (.deb)</a>
                <p class="download-description">For Ubuntu, Debian, and Linux Mint</p>
              </div>
              <div class="download-option">
                <a href="https://www.dropbox.com/scl/fi/ezp63b8jhozmw6u7rexwo/SikhiToTheMax-9.3.2.AppImage?rlkey=n3sq6ffs0qozze3t4bphwfmeg&st=9muhlalx&dl=1" class="download-button">Download (.AppImage)</a>
                <p class="download-description">Universal software package format</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
